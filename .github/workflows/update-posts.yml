name: Update weekly post list

# The Weekly Economic Update goes live on Substack at 9:30am ET each Friday.
# Cron here is always UTC, and 9:30am ET is 13:30 UTC in summer / 14:30 UTC in
# winter — so we check every 20 minutes across both windows rather than once.
# GitHub's scheduler is also routinely a few minutes late and occasionally skips
# a tick, so the repeats are the safety net. Runs that find nothing new exit
# without committing, so the extra ticks cost nothing.

on:
  schedule:
    - cron: "5,25,45 13-16 * * 5"   # Fridays, 13:05–16:45 UTC (9:05am–12:45pm ET)
    - cron: "15 18 * * *"           # daily catch-all, in case a post lands off-schedule
  workflow_dispatch:                # lets you run it by hand from the Actions tab

concurrency:
  group: update-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the three newest posts from the Substack feed
        run: python3 scripts/update_posts.py

      - name: Commit if the list changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.json
          git commit -m "Update weekly post list from Substack feed"
          git push
